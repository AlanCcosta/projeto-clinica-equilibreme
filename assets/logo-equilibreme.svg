<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70" fill="none">
  <!-- Symbol / Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer balance circle with soft gradient stroke -->
    <circle cx="27" cy="27" r="25" stroke="#364536" stroke-width="1.8" stroke-dasharray="2 3" opacity="0.4" />
    <circle cx="27" cy="27" r="21" stroke="#BA9E77" stroke-width="1.5" />
    
    <!-- Central Organic Equilibrium Emblem -->
    <!-- Leaf 1 (Left upwards) -->
    <path d="M27 27 C20 18, 16 12, 27 6 C38 12, 34 18, 27 27 Z" fill="#364536" />
    <!-- Leaf 2 (Right downwards) -->
    <path d="M27 27 C34 36, 38 42, 27 48 C16 42, 20 36, 27 27 Z" fill="#BA9E77" />
    <!-- Graceful horizontal harmony arcs -->
    <path d="M12 27 C16 22, 22 22, 27 27 C32 32, 38 32, 42 27" stroke="#364536" stroke-width="2" stroke-linecap="round" />
    <circle cx="27" cy="27" r="2.8" fill="#FFFFFF" stroke="#364536" stroke-width="1.5" />
    <circle cx="27" cy="15" r="1.5" fill="#BA9E77" />
    <circle cx="27" cy="39" r="1.5" fill="#364536" />
  </g>

  <!-- Typography -->
  <g transform="translate(75, 18)">
    <text x="0" y="22" font-family="'Plus Jakarta Sans', 'Montserrat', -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#243024">
      EQUILIBRE<tspan fill="#BA9E77">ME</tspan>
    </text>
    <text x="1" y="36" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="8.5" font-weight="600" letter-spacing="4.5" fill="#697769">
      CLÍNICA &amp; BEM-ESTAR
    </text>
  </g>
</svg>

